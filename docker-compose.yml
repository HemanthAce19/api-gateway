# One command demo:  docker compose up --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  demo-service:
    build: .
    command: ["uvicorn", "demo_service.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"   # exposed on purpose so the demo can show the unprotected service

  gateway:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      demo-service:
        condition: service_started
    environment:
      # Demo-only default. Set JWT_SECRET in your shell or a .env file for anything real.
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-change-me-0123456789abcdef}
      REDIS_URL: redis://redis:6379/0
      DEMO_UPSTREAM: http://demo-service:9000
      DEMO_MODE: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
