[project]
name = "api-gateway"
version = "0.1.0"
description = "Rate-limited API gateway: JWT auth, atomic Redis token bucket, async reverse proxy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "redis>=5.0",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.23", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:The HMAC key is:Warning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = ["gateway", "demo_service"]

[tool.setuptools.package-data]
gateway = ["*.lua"]
